<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать пост - Велобподбор</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="create-post-page">
    <div class="header">
        <a href="main.html" class="logo-link">
            <img src="images/logo.png" alt="Логотип" class="logo">
        </a>
        <button class="geo-btn">
            <img src="images/geo_icon.png" alt="Геолокация" class="geo-icon">
        </button>
        <div class="search-container">
            <img src="images/search_icon.png" alt="Поиск" class="search-icon">
            <p class="search-placeholder">Поиск</p>
            <input type="text" class="search-input">
            <button class="cross-btn">
                <img src="images/10728089 2.png" alt="Отмена" class="cross-icon">
            </button>
        </div>
        <a href="create-post.html" class="create-btn-link">
            <button class="create-btn">Создать</button>
        </a>
        <a href="profile.html" class="profile-link">
            <div class="profile-circle">A</div>
        </a>
    </div>
    <div class="create-post-container">
        <div class="form-title1">Введите Заголовок:</div>
        <input type="text" class="title-input" placeholder="">
        
        <div class="form-title">Загрузите изображение:</div>
        <div class="image-upload">
            <img src="images\Image (3).png" alt="Иконка" class="upload-icon">
            <button class="choose-btn">Выбрать</button>
        </div>
        
        <div class="form-title">Ссылка на карту:</div>
        <button class="instruction-btn">Инструкция</button>
        <input type="text" class="map-input" placeholder="">
        
        <div class="form-title2">Описание:</div>
        <textarea class="description-input" placeholder=""></textarea>
        
        <button class="create-post-btn">Создать</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
